name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: 'false'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT: zeusos

permissions:
  contents: read

jobs:
  # ===========================================================================
  # BUILD AND TEST
  # ===========================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || true

      - name: Run unit tests
        run: npm run test:unit -- --run
        env:
          CI: true

      - name: Build application
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # ===========================================================================
  # DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: production
      url: https://os.zeustheagency.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Write the service-account JSON to a tempfile and point
      # GOOGLE_APPLICATION_CREDENTIALS at it. Replaces the deprecated
      # FIREBASE_TOKEN path (was expiring silently and blocking deploys).
      # Pipe the secret through an env var rather than interpolating it
      # directly into the shell command — otherwise embedded newlines or
      # quotes in the JSON mangle the written file and the CLI falls
      # back to "have you run firebase login?".
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          # Sanity-check it parsed as JSON with the expected fields,
          # without leaking the key material to the log.
          node -e "const k=require(process.env.GOOGLE_APPLICATION_CREDENTIALS||process.argv[1]); if(!k.client_email||!k.private_key){process.exit(2)} console.log('sa ok:', k.client_email.split('@')[0]+'@...')" "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project ${{ env.FIREBASE_PROJECT }}

      - name: Deploy Firestore indexes
        run: firebase deploy --only firestore:indexes --project ${{ env.FIREBASE_PROJECT }}

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project ${{ env.FIREBASE_PROJECT }}

      - name: Deploy hosting
        run: firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT }}

  # ===========================================================================
  # POST-DEPLOYMENT VERIFICATION
  # ===========================================================================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health check
        run: |
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://os.zeustheagency.com)
            if [ "$response" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Got $response, waiting..."
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Smoke test
        run: |
          curl -s https://os.zeustheagency.com | grep -q "ZeusOS" || echo "Smoke test warning"
