name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: 'false'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  FIREBASE_PROJECT: zeusos

permissions:
  contents: read

jobs:
  # ===========================================================================
  # BUILD AND TEST
  # ===========================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || true

      - name: Run unit tests
        run: npm run test:unit -- --run
        env:
          CI: true

      - name: Build application
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # ===========================================================================
  # DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: production
      url: https://zeusos.web.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Authenticate using a long-lived CI token generated via:
      #   npx firebase login:ci
      # Store the printed token as the FIREBASE_TOKEN repository secret
      # (Settings → Secrets and variables → Actions → New repository secret).
      #
      # SA-key auth (FIREBASE_SERVICE_ACCOUNT JSON) was removed because the
      # GCP org policy constraints/iam.disableServiceAccountKeyCreation blocks
      # key creation on all service accounts in this project. FIREBASE_TOKEN
      # is the supported fallback — the Firebase CLI picks it up automatically
      # for all deploy sub-commands when FIREBASE_TOKEN is set in the env.
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set."
            echo "::error::Run 'npx firebase login:ci' locally and add the printed token as the FIREBASE_TOKEN repository secret."
            exit 1
          fi
          echo "Firebase token present (length: ${#FIREBASE_TOKEN})"

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project ${{ env.FIREBASE_PROJECT }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Firestore indexes
        run: firebase deploy --only firestore:indexes --project ${{ env.FIREBASE_PROJECT }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project ${{ env.FIREBASE_PROJECT }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy hosting
        run: firebase deploy --only hosting --project ${{ env.FIREBASE_PROJECT }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # Cloud Functions deploy. The firebase.json `functions` predeploy
      # rebuilds the bundled MCP server from `zeusos-mcp-server/` and
      # copies dist into `functions/vendor/zeusos-mcp-server/`, so the
      # vendor directory does not need to be checked into git.
      # `npm ci` in the functions dir is required because the Firebase
      # CLI does not install transitive function deps automatically when
      # invoked from CI.
      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project ${{ env.FIREBASE_PROJECT }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ===========================================================================
  # POST-DEPLOYMENT VERIFICATION
  # ===========================================================================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      # The custom domain os.zeustheagency.com is not yet DNS-active — see
      # docs/CUSTOM_DOMAIN_SETUP.md. Until DNS is verified, hit the
      # Firebase-managed URL so the verify job reflects the actual deploy
      # rather than DNS state. Swap back to the custom domain once it
      # resolves in CI.
      - name: Health check
        run: |
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://zeusos.web.app)
            if [ "$response" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: Got $response, waiting..."
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Smoke test
        run: |
          curl -s https://zeusos.web.app | grep -q "ZeusOS" || echo "Smoke test warning"
